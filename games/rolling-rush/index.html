<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rolling Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a103c;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; display: block; }

  .hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: 0; right: 0;
    display: flex; justify-content: space-between; gap: 8px;
    padding: 0 16px;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
    font-weight: 700;
  }
  .hud .pill {
    background: rgba(0,0,0,.28);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: clamp(14px, 2.4vh, 20px);
    backdrop-filter: blur(4px);
  }
  .hud .coin::before { content: "●"; color: #ffd23e; margin-right: 6px; }

  #toast {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translateX(-50%) scale(.8);
    background: rgba(0,0,0,.45);
    color: #ffd23e;
    font-weight: 800;
    font-size: clamp(18px, 3.6vh, 30px);
    letter-spacing: .06em;
    padding: 12px 28px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    z-index: 5;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: rgba(16, 8, 42, .62);
    color: #fff;
    text-align: center;
    padding: 24px 0;
    backdrop-filter: blur(3px);
    z-index: 10;
  }
  .screen.hidden { display: none; }
  .screen h1 {
    font-size: clamp(34px, 8vh, 64px);
    letter-spacing: .02em;
    background: linear-gradient(180deg, #ffd23e, #ff7a59);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.4));
  }
  .screen h2 { font-size: clamp(24px, 5vh, 40px); }
  .screen p { font-size: clamp(14px, 2.6vh, 18px); opacity: .9; max-width: 34ch; line-height: 1.45; padding: 0 16px; }
  .screen .stats { font-size: clamp(16px, 3vh, 22px); line-height: 1.6; }
  .screen .stats b { color: #ffd23e; }
  .btn {
    pointer-events: auto;
    border: 0; cursor: pointer;
    font: inherit; font-weight: 800;
    font-size: clamp(17px, 3vh, 22px);
    color: #2a1450;
    background: linear-gradient(180deg, #ffe27a, #ffb347);
    padding: 14px 44px;
    border-radius: 999px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.35);
    transition: transform .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .hint { font-size: 13px; opacity: .65; }

  .picker-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .7;
    margin-top: 6px;
  }
  .ball-row {
    pointer-events: auto;
    display: flex; gap: 8px;
    max-width: min(92vw, 560px);
    overflow-x: auto;
    padding: 6px 12px 10px;
    scrollbar-width: thin;
  }
  .ball-chip {
    flex: 0 0 auto;
    width: 54px; height: 54px;
    padding: 3px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform .1s ease, border-color .1s ease;
  }
  .ball-chip canvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .ball-chip:active { transform: scale(.92); }
  .ball-chip.selected {
    border-color: #ffd23e;
    box-shadow: 0 0 12px rgba(255, 210, 62, .55);
    transform: scale(1.08);
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<!-- YouTube Playables SDK: only resolves inside the YouTube environment; harmless elsewhere -->
<script src="https://www.youtube.com/game_api/v1" defer onerror="void 0"></script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill" id="hud-dist">0 m</div>
  <div class="pill" id="hud-level">Lv 1</div>
  <div class="pill coin" id="hud-coins">0</div>
</div>

<div id="toast"></div>

<div class="screen" id="screen-start">
  <h1>Rolling Rush</h1>
  <p>Drag (or use ◀ ▶ keys) to steer. Dodge the holes, hit the ramps, ride the loops — the world changes every level!</p>
  <div class="picker-label">Choose your ball</div>
  <div class="ball-row" id="ball-row-start"></div>
  <button class="btn" id="btn-play">PLAY</button>
  <p class="hint" id="best-line"></p>
</div>

<div class="screen hidden" id="screen-over">
  <h2>You fell!</h2>
  <p class="stats" id="over-stats"></p>
  <div class="ball-row" id="ball-row-over"></div>
  <button class="btn" id="btn-retry">PLAY AGAIN</button>
</div>

<div class="screen hidden" id="screen-pause">
  <h2>Paused</h2>
  <button class="btn" id="btn-resume">RESUME</button>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
